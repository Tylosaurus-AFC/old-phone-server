# Runs tests/run.sh (shell syntax, secret scan, ruff, the shell tests against fake
# batteries/Shizuku/adb/ssh/clock and the bot's unit tests) on every push and pull request.
# No phone, network or secrets needed. Python 3.13 is what Debian 13 gives the bot on the
# phone; 3.11 keeps older Debian/Termux Pythons working.
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install requests ruff==0.16.9
      - run: bash tests/run.sh
